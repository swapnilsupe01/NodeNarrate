[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nodenarrate"
version = "0.1.0"
authors = [
    { name = "Swapnil Supe", email = "swapnilsupe01@gmail.com" },
]
description = "Visual step-by-step debugger and execution tracer for LangGraph agents without LangSmith accounts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["langgraph", "langchain", "debugging", "agent", "llm", "tracer", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "langchain-core>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/swapnilsupe01/NodeNarrate"
"Hugging Face Space" = "https://huggingface.co/spaces/swapnilsupe01/NodeNarrate"
"Bug Tracker" = "https://github.com/swapnilsupe01/NodeNarrate/issues"

[tool.setuptools.packages.find]
include = ["nodenarrate*"]
exclude = ["backend*", "frontend*", "space*", "examples*", "assets*"]

